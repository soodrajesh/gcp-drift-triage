[project]
name = "driftriage"
version = "0.1.0"
description = "Terraform drift triage: classify, attribute and decide adopt / revert / investigate"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27", "google-auth>=2.30", "requests>=2.31", "google-genai>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "ruff"]
openai = ["openai>=1.50"]  # test/eval-only provider; never installed in the deployed image

[project.scripts]
driftriage = "driftriage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["driftriage"]

[tool.setuptools.package-data]
driftriage = ["*.html", "samples/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
testpaths = ["tests"]
markers = [
  "live_vertex: calls Gemini on Vertex AI; opt-in via DRIFTRIAGE_LIVE_VERTEX=1",
  "live_openai: calls OpenAI; opt-in via DRIFTRIAGE_LIVE_OPENAI=1",
  "live_gcp: reads real Cloud Audit Logs; opt-in via DRIFTRIAGE_LIVE_PROJECT=<project>",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
